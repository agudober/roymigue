<style>

header{text-align:center;padding:40px 0 20px;position:relative}header .h{font-size:34px}

.sp{display:flex;align-items:center;gap:12px;background:#121212;color:#fff;border-radius:14px;padding:10px 14px;margin-top:14px;text-decoration:none}.sp .nm{display:flex;flex-direction:column;min-width:0;flex:1}.sp b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sp small{color:#b3b3b3;font-size:12px}.sp .bars{flex:none}.sp .qr{display:none;background:#fff;padding:4px;border-radius:6px;line-height:0}.sp .qr svg{width:56px;height:56px}@media(min-width:700px){.sp .qr{display:block}}@media(max-width:420px){.sp .bars{display:none}}

 .featured-stage{height:220px}

#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.cd{cursor:pointer;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--sh);transition:transform .15s}.cd:hover{transform:translateY(-2px)}

.mw{display:flex;width:min(1100px,100%);height:100%;max-height:900px;background:var(--bg);border-radius:20px;overflow:hidden;box-shadow:var(--sh);position:relative}

.rc img,.rc video,.rc .nc{width:100%;aspect-ratio:1;object-fit:cover;display:block}.rc small{display:block;font-size:11px;padding:3px 5px;line-height:1.2;max-height:2.6em;overflow:hidden}

h1{color:var(--acc)}.cd{position:relative}
.dots{position:absolute;top:6px;right:6px;width:30px;height:30px;padding:0;border-radius:50%;background:transparent;color:#fff;font-size:20px;line-height:1;opacity:.2;transition:opacity .15s,background .15s;text-shadow:0 1px 4px rgba(0,0,0,.55)}
.cd:hover .dots,.dots:hover,.dots:focus-visible{opacity:1;background:rgba(0,0,0,.35)}
.body{position:relative}.body .dots{color:var(--mute);text-shadow:none;top:10px;right:12px}.body .dots:hover{background:var(--line)}
#mn{position:fixed;z-index:10;display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:6px;min-width:178px}#mn.on{display:block}
#mn button{display:block;width:100%;text-align:left;background:none;color:var(--ink);border-radius:8px;padding:9px 12px;font-weight:400}#mn button:hover{background:var(--line)}#mn .rd{color:#d23f5f}
.rx{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.rx button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:6px 11px;font-size:15px;display:flex;align-items:center;gap:6px}.rx button.on{border-color:var(--acc);background:var(--line)}.rx button span{font-size:12px;color:var(--mute)}.rxlabel{font-size:13px;color:var(--mute);margin-top:14px}
#f.open{position:fixed;z-index:11;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,94vw);max-height:90vh;overflow:auto;margin:0;box-shadow:0 0 0 100vmax rgba(60,20,40,.5),var(--sh)}
#cf{position:fixed;inset:0;z-index:12;background:rgba(60,20,40,.5);display:none;align-items:center;justify-content:center;padding:16px}#cf.on{display:flex}
.cb{background:var(--card);border-radius:16px;padding:20px;max-width:340px;box-shadow:var(--sh)}.cb p{margin:0 0 14px}
#ts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#3d2a33;color:#fff;padding:10px 18px;border-radius:999px;z-index:13;display:none;max-width:92vw;font-size:14px;text-align:center}

/* Ajuste final de galería: las fotos ocupan todo el ancho sin bandas rosas */
#mm .grid{
  display:block!important;
  width:100%!important;
  margin:0!important;
  padding:0!important;
  column-count:2!important;
  column-gap:0!important;
  column-fill:balance;
}

  display:inline-block!important;

  max-width:none!important;

  padding:0!important;
  border:0!important;
  border-radius:0!important;

  object-fit:cover;

@media(max-width:420px){
  #mm .grid{column-gap:0!important;padding:0!important}
}

function spUrl(s){s=(s||"").trim();const m=s.match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(track|album|playlist|episode|artist)\/([A-Za-z0-9]+)/)||s.match(/^spotify:(track|album|playlist|episode|artist):([A-Za-z0-9]+)/);return m?`https://open.spotify.com/${m[1]}/${m[2]}`:""}
function sp(i){if(!i.song)return "";let h=0;for(const c of i.song.split("/").pop())h=(h*31+c.charCodeAt(0))>>>0;const b=[];for(let k=0;k<23;k++){h=(h*1103515245+12345)>>>0;b.push(4+(h>>>16)%22)}let qr="";try{if(window.qrcode){const q=qrcode(0,"M");q.addData(i.song);q.make();qr=q.createSvgTag({cellSize:3,margin:0,scalable:true})}}catch(e){}return `<a class="sp" href="${esc(i.song)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="30" height="30" style="flex:none"><circle cx="12" cy="12" r="12" fill="#1ed760"/><path d="M5.5 9c4.5-1.3 9-1 13 1.2M6.3 12.6c3.7-1 7.2-.7 10.4 1M7.2 16c3-.8 5.7-.5 8.2.8" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg><span class="nm"><b>${esc(i.song_name||"Escuchar en Spotify")}</b><small>Abrir en Spotify</small></span><svg class="bars" viewBox="0 0 92 32" width="92" height="32">${b.map((v,k)=>`<rect x="${k*4}" y="${16-v/2}" width="2.6" height="${v}" rx="1.3" fill="#fff"/>`).join("")}</svg><span class="qr">${qr}</span></a>`}
function opts(i){const o=[];if(ED)o.push(["edit","✏️ Editar"]);if(ED)o.push(["feature",i.is_featured?"☆ Quitar de destacados":"⭐ Destacar recuerdo"]);if(i.song)o.push(["spo","🎵 Abrir en Spotify"]);if(ED)o.push(["del","🗑️ Eliminar","rd"]);return o}
const dots=i=>opts(i).length?`<button class="dots" data-dots="${esc(i.id)}" aria-label="Más opciones">⋯</button>`:"";
function menu(id,b){const i=items.find(x=>x.id===id);if(!i)return;const r=b.getBoundingClientRect(),m=$("#mn");m.innerHTML=opts(i).map(([a,t,c])=>`<button data-act="${a}" data-id="${esc(id)}" class="${c||""}">${t}</button>`).join("");m.classList.add("on");const w=m.offsetWidth,h=m.offsetHeight;m.style.left=Math.max(8,Math.min(r.right-w,innerWidth-w-8))+"px";m.style.top=(r.bottom+h+8>innerHeight?r.top-h-4:r.bottom+4)+"px"}

async function checkEditor(){
  ED=false;me=session?.user?.id||null;
  let editorError=null;
  if(me){
    const {data,error}=await sb.from("editors").select("user_id").eq("user_id",me).maybeSingle();
    ED=!!data&&!error;editorError=error;
  }
  $("#add").hidden=!ED;
  $("#email").hidden=!!session;$("#password").hidden=!!session;$("#login").hidden=!!session;$("#logout").hidden=!session;
  $("#authstatus").textContent=ED
    ?"Sesión iniciada como editor: puedes añadir, editar y eliminar recuerdos."
    :session
      ?(editorError?"Has iniciado sesión, pero no se pudo comprobar el permiso de editor. Revisa la tabla public.editors y sus políticas RLS.":"Has iniciado sesión, pero este usuario no está en public.editors. Ejecuta el SQL de autorización de editores.")
      :"Acceso privado para los dos editores. Pulsa aquí para iniciar sesión.";
}
async function loadReactions(){const {data,error}=await sb.from("memory_reactions").select("memory_id,visitor_id,emoji");if(error){console.warn("No se pudieron cargar las reacciones. Ejecuta el SQL actualizado.",error);reactions=[];return}reactions=data||[]}
function reactionHTML(i){const mine=reactions.find(r=>r.memory_id===i.id&&r.visitor_id===VISITOR_ID);return `<div class="rxlabel">Reacciona a este recuerdo</div><div class="rx">${EMO.map(em=>{const count=reactions.filter(r=>r.memory_id===i.id&&r.emoji===em).length;return `<button type="button" data-react="${em}" data-id="${esc(i.id)}" class="${mine?.emoji===em?"on":""}" aria-label="Reaccionar ${em}">${em}<span>${count||""}</span></button>`}).join("")}</div>`}
async function loadMemories(){const {data,error}=await sb.from("memories").select("*").order("date",{ascending:false}).order("created_at",{ascending:false});if(error){$("#st").textContent="No se pudieron cargar los recuerdos: "+error.message;return}items=(data||[]).map(r=>({...r,is_featured:!!r.is_featured,media:Array.isArray(r.media)?r.media:[]}));FEATURED_ORDER=items.filter(i=>i.is_featured).map(i=>i.id).sort(()=>Math.random()-.5);await loadReactions();render()}
async function init(){if(!configReady()){$("#st").textContent="Falta configurar Supabase: introduce la URL del proyecto y la clave publicable/anon en este HTML.";$("#authstatus").textContent="Configuración pendiente de Supabase.";$("#add").hidden=true;return}if(!window.supabase){$("#st").textContent="No se ha podido cargar la librería de Supabase. Comprueba tu conexión.";return}sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const {data}=await sb.auth.getSession();session=data.session;await checkEditor();await loadMemories();channel=sb.channel("memories-live").on("postgres_changes",{event:"*",schema:"public",table:"memories"},()=>loadMemories()).subscribe();sb.auth.onAuthStateChange((_event,s)=>{session=s;Promise.resolve().then(async()=>{await checkEditor();await loadMemories()})})}

$("#accountToggle").onclick=()=>{
  const panel=$("#authbox"),isOpen=panel.classList.toggle("open");
  $("#accountToggle").setAttribute("aria-expanded",String(isOpen));
  if(isOpen&&!session)$("#email").focus();
};
async function doLogin(){
  if(!sb){toast("Supabase todavía no está conectado.");return}
  const email=$("#email").value.trim(),password=$("#password").value;
  if(!email||!password){toast("Introduce el correo y la contraseña.");return}
  $("#login").disabled=true;$("#authstatus").textContent="Comprobando acceso…";
  const {error}=await sb.auth.signInWithPassword({email,password});
  $("#login").disabled=false;
  if(error){$("#authstatus").textContent="No se pudo iniciar sesión: "+error.message;toast("Comprueba el correo y la contraseña.");return}
  setTimeout(async()=>{
    await checkEditor();
    if(ED){
      $("#authbox").classList.remove("open");
      $("#accountToggle").setAttribute("aria-expanded","false");
      toast("Acceso de editor correcto.");
    }else{
      toast("La cuenta existe, pero todavía no está autorizada en public.editors.");
    }
  },300);
}
$("#login").onclick=doLogin;
$("#password").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});
$("#email").addEventListener("keydown",e=>{if(e.key==="Enter")$("#password").focus()});
$("#logout").onclick=async()=>{if(sb){const {error}=await sb.auth.signOut();if(error)toast("No se pudo cerrar sesión: "+error.message);else{toast("Sesión cerrada.");$("#authbox").classList.remove("open");$("#accountToggle").setAttribute("aria-expanded","false")}}};

let featuredCenter=0,featuredTimer=null,featuredTouchX=0;
function featuredItems(){return FEATURED_ORDER.map(id=>items.find(i=>i.id===id)).filter(Boolean)}
function featuredIndexOffset(index,center,total){let d=(index-center+total)%total;if(d>total/2)d-=total;return d}
function paintFeatured(){
  const featured=featuredItems(),root=$("#featuredCarousel"),total=featured.length;
  if(!total){root.innerHTML="";return}
  featuredCenter=((featuredCenter%total)+total)%total;
  root.innerHTML=featured.map((i,index)=>{
    const offset=featuredIndexOffset(index,featuredCenter,total);
    const visible=Math.abs(offset)<=2;
    return `<div class="featured-card ${visible?"pos-"+offset:""}" data-featured="${esc(i.id)}" aria-hidden="${visible?"false":"true"}" style="${visible?"":"visibility:hidden"}">${cov(i)}${dots(i)}<div class="ct"><small>⭐ ${esc(fmt(i.date))}</small><b>${esc(i.title)}</b></div></div>`;
  }).join("");
}
function stopFeaturedAutoplay(){if(featuredTimer){clearInterval(featuredTimer);featuredTimer=null}}
function startFeaturedAutoplay(){stopFeaturedAutoplay();if(featuredItems().length>1&&!document.hidden){featuredTimer=setInterval(()=>moveFeatured(1),4200)}}
function moveFeatured(direction){const total=featuredItems().length;if(total<2)return;featuredCenter=(featuredCenter+direction+total)%total;paintFeatured();startFeaturedAutoplay()}
function renderFeatured(){
  const featured=featuredItems(),section=$("#featuredSection");
  section.hidden=!featured.length;
  if(!featured.length){stopFeaturedAutoplay();$("#featuredCarousel").innerHTML="";return}
  featuredCenter=((featuredCenter%featured.length)+featured.length)%featured.length;
  paintFeatured();startFeaturedAutoplay();
}
function render(){const q=$("#q").value.toLowerCase().trim(),L=items.filter(i=>!q||[i.title,i.place,i.trip,i.text].join(" ").toLowerCase().includes(q));VIS=L;$("#st").textContent=items.length?(L.length?"":"Nada coincide con tu búsqueda."):"Todavía no hay recuerdos. ¡Empieza por el primero!";renderFeatured();$("#list").innerHTML=L.map(i=>`<div class="cd" data-open="${esc(i.id)}">${cov(i)}${dots(i)}<div class="ct"><small>${esc(fmt(i.date))}</small><b>${esc(i.title)}</b></div></div>`).join("");if(CUR){fillM(1);rail()}}
function fillM(k){const i=items.find(x=>x.id===CUR);if(!i){closeM();return}const sc=$("#mm").scrollTop,md=i.media||[],n=Math.min(md.length,3);$("#mm").innerHTML=`${md.length?`<div class="grid n${n}">${md.map((m,j)=>m.t==="v"?`<div class="media-tile vw"><video src="${esc(mediaUrl(m))}#t=0.1" preload="metadata" muted playsinline data-m="${esc(i.id)}" data-i="${j}"></video></div>`:`<div class="media-tile"><img src="${esc(mediaUrl(m))}" data-m="${esc(i.id)}" data-i="${j}" alt=""></div>`).join("")}</div>`:""}<div class="body">${dots(i)}<div class="meta">${esc(fmt(i.date))}${i.place?" · "+esc(i.place):""}${i.trip?" · "+esc(i.trip):""}</div><h2>${esc(i.title)}</h2>${i.text?`<p class="tx">${esc(i.text)}</p>`:""}${sp(i)}${reactionHTML(i)}<div class="by"><span>${i.author===me&&me?"Añadido por ti":""}</span></div></div>`;$("#mm").scrollTop=k?sc:0}
function rail(){$("#rl").innerHTML=VIS.map(i=>`<div class="rc" data-rid="${esc(i.id)}">${cov(i)}<small>${esc(i.title)}</small></div>`).join("");mark()}
function mark(){document.querySelectorAll(".rc").forEach(r=>{const on=r.dataset.rid===CUR;r.classList.toggle("on",on);if(on)r.scrollIntoView({block:"nearest"})})}
function openM(id){CUR=id;$("#mv").classList.add("on");fillM();rail()}function closeM(){$("#mv").classList.remove("on");CUR=null}

$("#q").oninput=render;
$("#list").onclick=e=>{const d=e.target.closest("[data-dots]");if(d){menu(d.dataset.dots,d);return}const c=e.target.closest("[data-open]");if(c)openM(c.dataset.open)};
$("#featuredCarousel").onclick=e=>{const d=e.target.closest("[data-dots]");if(d){e.stopPropagation();menu(d.dataset.dots,d);return}const c=e.target.closest("[data-featured]");if(c)openM(c.dataset.featured)};

$("#featuredNext").onclick=()=>moveFeatured(1);

$("#featuredCarousel").addEventListener("mouseleave",startFeaturedAutoplay);

$("#featuredCarousel").addEventListener("focusout",startFeaturedAutoplay);

$("#featuredCarousel").addEventListener("touchend",e=>{const delta=e.changedTouches[0].clientX-featuredTouchX;if(Math.abs(delta)>45)moveFeatured(delta<0?1:-1);else startFeaturedAutoplay()},{passive:true});
document.addEventListener("visibilitychange",()=>document.hidden?stopFeaturedAutoplay():startFeaturedAutoplay());
$("#rl").onclick=e=>{const c=e.target.closest("[data-rid]");if(c){CUR=c.dataset.rid;fillM();mark()}};
$("#mc").onclick=closeM;$("#mv").onclick=e=>{if(e.target.id==="mv")closeM()};
addEventListener("keydown",e=>{if(!CUR||$("#lb").classList.contains("on"))return;const k=VIS.findIndex(x=>x.id===CUR),n=e.key==="ArrowDown"?VIS[k+1]:e.key==="ArrowUp"?VIS[k-1]:null;if(n){e.preventDefault();CUR=n.id;fillM();mark()}if(e.key==="Escape")closeM()});
$("#mm").onclick=async e=>{const t=e.target.closest("[data-react]");if(t){const id=t.dataset.id,emoji=t.dataset.react;try{const {error}=await sb.from("memory_reactions").upsert({memory_id:id,visitor_id:VISITOR_ID,emoji},{onConflict:"memory_id,visitor_id"});if(error)throw error;await loadReactions();if(CUR===id)fillM(1)}catch(x){toast("No se pudo guardar la reacción. Comprueba que has ejecutado el SQL actualizado.")}return}const target=e.target;if(target.dataset.dots){menu(target.dataset.dots,target);return}if(target.dataset.m){const it=items.find(x=>x.id===target.dataset.m);if(it)lb(it.media,+target.dataset.i)}};
$("#mn").onclick=async e=>{const b=e.target.closest("[data-act]");if(!b)return;$("#mn").classList.remove("on");const it=items.find(x=>x.id===b.dataset.id),a=b.dataset.act;if(!it)return;if(a==="edit"){closeM();edit(it)}else if(a==="feature"){if(!ED)return;try{const next=!it.is_featured;const {error}=await sb.from("memories").update({is_featured:next}).eq("id",it.id);if(error)throw error;toast(next?"Recuerdo añadido a destacados.":"Recuerdo quitado de destacados.");await loadMemories()}catch(x){toast("No se pudo actualizar el destacado: "+(x.message||"comprueba el SQL y los permisos"))}}else if(a==="spo")open_(it.song);else if(a==="del"&&await ask("¿Eliminar este recuerdo? No se puede deshacer.")){try{const {error}=await sb.from("memories").delete().eq("id",it.id);if(error)throw error;const paths=(it.media||[]).map(m=>m.path).filter(Boolean);const driveIds=(it.media||[]).map(m=>m.driveId).filter(Boolean);if(paths.length)await removeStorage(paths);if(driveIds.length)await removeDriveFiles(driveIds);if(CUR===it.id)closeM();toast("Recuerdo eliminado.")}catch(x){toast("No se pudo eliminar: "+(x.message||"comprueba los permisos"))}}};
function ask(q){return new Promise(r=>{$("#cq").textContent=q;$("#cf").classList.add("on");const f=v=>{$("#cf").classList.remove("on");r(v)};$("#cy").onclick=()=>f(true);$("#cn").onclick=()=>f(false)})}
addEventListener("click",e=>{if(!e.target.closest("[data-dots],#mn"))$("#mn").classList.remove("on")});addEventListener("scroll",()=>$("#mn").classList.remove("on"),true);

// Visor de fotos y vídeos
function lb(l,i){LB={l,i};show();$("#lb").classList.add("on")}
function show(){const m=LB.l[LB.i];$("#lc").innerHTML=m.t==="v"?`<video src="${esc(mediaUrl(m))}" controls autoplay playsinline></video>`:`<img src="${esc(mediaUrl(m))}" alt="">`;$("#lp").style.display=$("#ln").style.display=LB.l.length>1?"":"none"}
const step=d=>{LB.i=(LB.i+d+LB.l.length)%LB.l.length;show()};$("#lp").onclick=()=>step(-1);$("#ln").onclick=()=>step(1);$("#lx").onclick=()=>{$("#lb").classList.remove("on");$("#lc").innerHTML=""};$("#lb").ontouchstart=e=>tx=e.touches[0].clientX;$("#lb").ontouchend=e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>60&&LB.l.length>1)step(d<0?1:-1)};addEventListener("keydown",e=>{if($("#lb").classList.contains("on")){if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1);if(e.key==="Escape")$("#lx").click()}});

// Crear / editar recuerdos
function openForm(){$("#f").classList.add("open");$("#t").focus()}
$("#add").onclick=()=>{if(!ED){toast("Esta cuenta no tiene permiso para editar.");return}E={id:null,media:[],fresh:[],freshDrive:[],removed:[],removedDrive:[]};$("#f").reset();$("#d").value=new Date().toISOString().slice(0,10);pv();openForm()};
function edit(i){if(!ED)return;E={id:i.id,media:[...(i.media||[])],fresh:[],freshDrive:[],removed:[],removedDrive:[]};$("#t").value=i.title||"";$("#d").value=i.date||"";$("#p").value=i.place||"";$("#v").value=i.trip||"";$("#x").value=i.text||"";$("#sg").value=i.song||"";$("#sn").value=i.song_name||"";pv();openForm();$("#f").scrollIntoView({behavior:"smooth"})}
function pv(){$("#pv").innerHTML=E.media.map((m,k)=>`<div class="th">${m.t==="v"?`<video src="${esc(mediaUrl(m))}#t=0.1" muted playsinline preload="metadata"></video>`:`<img src="${esc(mediaUrl(m))}" alt="">`}<div class="ctl"><b data-mv="${k}" data-d="-1">◀</b><b data-rm="${k}">✕</b><b data-mv="${k}" data-d="1">▶</b></div></div>`).join("")}
$("#pv").onclick=e=>{const t=e.target;if(t.dataset.mv!==undefined){const k=+t.dataset.mv,j=k+ +t.dataset.d;if(j>=0&&j<E.media.length){[E.media[k],E.media[j]]=[E.media[j],E.media[k]];pv()}}if(t.dataset.rm!==undefined){const m=E.media.splice(+t.dataset.rm,1)[0];if(m.path)E.removed.push(m.path);if(m.driveId)E.removedDrive.push(m.driveId);pv()}};
function shrink(f){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(new Error("No se pudo procesar la imagen.")),"image/jpeg",.85)};im.onerror=()=>no(new Error("No se pudo leer la imagen."));im.src=URL.createObjectURL(f)})}
let driveTokenCache=null,driveTokenExpiry=0;
async function getDriveAccessToken(){
  if(driveTokenCache&&Date.now()<driveTokenExpiry)return driveTokenCache;
  const {data:{session:current}}=await sb.auth.getSession();
  if(!current?.access_token)throw new Error("Tu sesión ha caducado. Vuelve a iniciar sesión.");
  const r=await fetch(`${SUPABASE_URL}/functions/v1/drive-storage?action=access-token`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${current.access_token}`},body:"{}"});
  const j=await r.json();if(!r.ok||!j.access_token)throw new Error(j.error||"No se pudo obtener acceso a Google Drive.");
  driveTokenCache=j.access_token;driveTokenExpiry=Date.now()+Math.max(60,(j.expires_in||3600)-120)*1000;return driveTokenCache;
}
async function uploadDriveFile(file){
  const token=await getDriveAccessToken(),mime=file.type||"application/octet-stream";
  const metadata={name:`${Date.now()}_${file.name}`,mimeType:mime};
  const start=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,name,mimeType",{method:"POST",headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json; charset=UTF-8","X-Upload-Content-Type":mime,"X-Upload-Content-Length":String(file.size)},body:JSON.stringify(metadata)});
  if(!start.ok)throw new Error("Google Drive no pudo iniciar la subida: "+await start.text());
  const uploadUrl=start.headers.get("Location");if(!uploadUrl)throw new Error("Google Drive no devolvió la dirección de subida.");
  const uploaded=await fetch(uploadUrl,{method:"PUT",headers:{"Content-Type":mime},body:file});
  const result=await uploaded.json().catch(()=>({}));if(!uploaded.ok||!result.id)throw new Error(result.error?.message||"No se pudo subir el archivo a Google Drive.");
  const perm=await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(result.id)}/permissions`,{method:"POST",headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json"},body:JSON.stringify({type:"anyone",role:"reader"})});
  if(!perm.ok){await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(result.id)}`,{method:"DELETE",headers:{Authorization:`Bearer ${token}`}});throw new Error("El archivo se subió, pero no se pudo habilitar su visualización pública: "+await perm.text());}
  return {driveId:result.id,t:mime.startsWith("video/")?"v":"i",name:result.name,mimeType:mime};
}
async function removeStorage(paths){const p=[...new Set(paths.filter(Boolean))];if(!p.length)return;const {error}=await sb.storage.from(BUCKET).remove(p);if(error)console.warn("No se pudieron borrar algunos archivos",error)}
async function removeDriveFiles(ids){const unique=[...new Set(ids.filter(Boolean))];if(!unique.length)return;const token=await getDriveAccessToken();for(const id of unique){const r=await fetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(id)}`,{method:"DELETE",headers:{Authorization:`Bearer ${token}`}});if(!r.ok&&r.status!==404)console.warn("No se pudo borrar el archivo de Drive",id,await r.text())}}
$("#i").onchange=async e=>{const fs=[...e.target.files];e.target.value="";if(!ED||!session){$("#fm").textContent="Inicia sesión con una cuenta autorizada para subir archivos.";return}$("#sv").disabled=true;let k=0;for(const f of fs){k++;$("#fm").textContent=`Subiendo ${k} de ${fs.length} a Google Drive…`;const v=f.type.startsWith("video/");try{const file=v?f:await shrink(f);const item=await uploadDriveFile(file);E.media.push(item);E.freshDrive.push(item.driveId);pv()}catch(x){$("#fm").textContent="Error con "+f.name+": "+(x.message||"no se pudo subir");$("#sv").disabled=false;return}}$("#fm").textContent="Archivos subidos a Google Drive. Guarda el recuerdo para confirmar los cambios.";$("#sv").disabled=false};
$("#cx").onclick=async()=>{try{await removeStorage(E.fresh);await removeDriveFiles(E.freshDrive)}catch(e){console.warn(e)}$("#f").classList.remove("open");$("#fm").textContent=""};
$("#f").onsubmit=async e=>{e.preventDefault();if(!ED||!me){$("#fm").textContent="No tienes permisos para guardar recuerdos.";return}$("#sv").disabled=true;try{const sg=spUrl($("#sg").value);if($("#sg").value.trim()&&!sg)throw new Error("El enlace de Spotify no es válido.");const d={title:$("#t").value.trim(),date:$("#d").value,place:$("#p").value.trim(),trip:$("#v").value.trim(),song:sg,song_name:$("#sn").value.trim(),text:$("#x").value.trim(),media:E.media};let result;if(E.id)result=await sb.from("memories").update(d).eq("id",E.id);else result=await sb.from("memories").insert({...d,author:me});if(result.error)throw result.error;await removeStorage(E.removed);await removeDriveFiles(E.removedDrive);E.fresh=[];E.freshDrive=[];$("#f").classList.remove("open");$("#fm").textContent="";toast("Recuerdo guardado.");await loadMemories()}catch(x){$("#fm").textContent="No se pudo guardar: "+(x.message||"error")}$("#sv").disabled=false};
